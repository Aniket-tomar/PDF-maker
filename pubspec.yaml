name: tinyscan
description: TinyScan - The <1MB PDF Document Scanner. A high-performance, cross-platform Flutter application for scanning, digitizing, and sharing documents with strictly optimized PDF sizes under 1.0 MB.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # PDF generation
  pdf: ^3.10.8

  # Image processing and compression
  image: ^4.1.7

  # Image capture from camera or gallery
  image_picker: ^1.0.7

  # File path utilities
  path_provider: ^2.1.2
  path: ^1.9.0

  # Sharing files
  share_plus: ^7.2.2

  # PDF viewing
  pdfx: ^2.5.0

  # Permissions
  permission_handler: ^11.3.0

  # Local storage for document metadata
  shared_preferences: ^2.2.2

  # UUID for document IDs
  uuid: ^4.3.3

  # Progress indicators and UI
  flutter_spinkit: ^5.2.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
